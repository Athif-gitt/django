{% comment %} <h1>Forms</h1>

<form method="POST">
    {% csrf_token %}
    <input type="text" name="name">
    <input type="submit" value="OK">
</form>

{% if message == 'Athif' %}
    {{ message }}
{% else %}
    <p>Not matched</p>
{% endif %} {% endcomment %}

<form action="" method='post'>
    {% csrf_token %}
    {{ message.as_p }}
    <input type="submit" value='Ok'> </input>
</form>
